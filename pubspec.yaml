name: ledato_stripes
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  protobuf: ^6.0.0
  share_plus: ^13.2.1
  yaml: ^3.1.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Windows fehlt hier bewusst: flutter_launcher_icons schreibt in die .ico
  # nur eine einzige Größe. Das Windows-Icon erzeugt stattdessen
  # tools/make_windows_icon.py aus derselben Quelldatei, mit allen Größen
  # von 16 bis 256 px.
