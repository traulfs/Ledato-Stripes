name: macOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build macos --release

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/ledato_stripes.app" "ledato-stripes-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ledato-stripes-macos
          path: ledato-stripes-macos.zip
