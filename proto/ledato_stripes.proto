syntax = "proto3";

package ledato_stripes;

// Speicherformat für Ledato Stripes: eine Konfiguration besteht aus einer
// oder mehreren vollständigen Lichtszenen (Pages), zwischen denen der
// Player umschaltet. Farben werden verlustfrei als ARGB-uint32
// gespeichert (Color.toARGB32()), nicht als 1-Byte-Palette.

message Document {
  uint32 schema_version = 1;
  repeated Page pages = 2;
  uint32 active_page_index = 3;
}

message Page {
  string id = 1;
  string name = 2;
  uint32 duration_ms = 3;
  double scene_width_meters = 4;
  double scene_aspect = 5;
  bool use_image_aspect = 6;
  string background_path = 7;
  double background_dim = 8;
  double glow = 9;
  repeated Strip strips = 10;
  repeated Matrix matrices = 11;
}

// Logische LED-Matrix, gebildet aus einem oder mehreren Stripes.
//
// Diese Nachricht ist die Schnittstelle zur Controller-Firmware: sie sagt,
// wie die fortlaufenden LED-Indizes der beteiligten Stripes als Pixelfläche
// zu lesen sind. Die geometrische Wahrheit (wo jede Zeile in der Szene
// liegt) steckt weiterhin in den Stripes und ihren Abschnitten — hier steht
// nur die logische Struktur, die ein Controller braucht, um (x, y) auf einen
// LED-Index abzubilden.
//
// Adressierung, die die Firmware daraus ableiten kann:
//   Zeile r liegt in dem Bank-Eintrag mit first_row <= r < first_row+row_count.
//   Innerhalb der Bank ist local = r - first_row.
//   Bei SERPENTINE laufen Zeilen mit ungeradem local rückwärts.
//   Index in der Bank = local * columns + (rückwärts ? columns-1-x : x).
// Der Index ist bankweise, beginnt in jedem Stripe also wieder bei 0 —
// passend dazu, dass jeder Stripe seine eigene Einspeisung hat.
message Matrix {
  string id = 1;
  string name = 2;
  uint32 columns = 3;
  uint32 rows = 4;
  MatrixWiring wiring = 5;
  MatrixOrigin origin = 6;
  // LED-Dichte aller beteiligten Stripes; zugleich der Pixelabstand der
  // Matrix (Zeilenabstand = Spaltenabstand = 1/leds_per_meter Meter).
  uint32 leds_per_meter = 7;
  // Die Stripes der Matrix, von der Ursprungsecke weg gestapelt. Die
  // Position in dieser Liste + 1 ist die DDP-destination des Stripes.
  repeated MatrixBank banks = 8;
}

// Ein Stripe als zusammenhängender Zeilenblock der Matrix.
message MatrixBank {
  string strip_id = 1;
  uint32 first_row = 2;
  uint32 row_count = 3;
}

enum MatrixWiring {
  // Mäander: jede zweite Zeile eines Stripes läuft rückwärts, das Kabel
  // schlängelt sich ohne Rückleitung durch den Block.
  MATRIX_WIRING_SERPENTINE = 0;
  // Jede Zeile beginnt an derselben Kante, zwischen den Zeilen liegt eine
  // Rückleitung.
  MATRIX_WIRING_PROGRESSIVE = 1;
}

// Ecke, in der Zeile 0 / Spalte 0 liegt und in der der erste Stripe
// eingespeist wird.
enum MatrixOrigin {
  MATRIX_ORIGIN_TOP_LEFT = 0;
  MATRIX_ORIGIN_TOP_RIGHT = 1;
  MATRIX_ORIGIN_BOTTOM_LEFT = 2;
  MATRIX_ORIGIN_BOTTOM_RIGHT = 3;
}

message Strip {
  string id = 1;
  string name = 2;
  uint32 leds_per_meter = 3;
  bool enabled = 4;
  repeated Section sections = 5;
  // Effekte über alle Abschnitte hinweg durchlaufen lassen, statt jeden
  // Abschnitt für sich rechnen zu lassen (z. B. ein Lauflicht, das sich
  // durch eine Matrix schlängelt). Default false = bisheriges Verhalten.
  bool continuous_effect = 6;
}

message Section {
  double start_x = 1;
  double start_y = 2;
  double angle = 3;
  uint32 led_count = 4;
  Effect effect = 5;
  uint32 color = 6;
  uint32 color2 = 7;
  double brightness = 8;
  double speed = 9;
  bool reversed = 10;
}

enum Effect {
  EFFECT_SOLID = 0;
  EFFECT_GRADIENT = 1;
  EFFECT_RAINBOW = 2;
  EFFECT_CHASE = 3;
  EFFECT_THEATER = 4;
  EFFECT_SCANNER = 5;
  EFFECT_COLOR_WIPE = 6;
  EFFECT_WAVE = 7;
  EFFECT_BREATHE = 8;
  EFFECT_BLINK = 9;
  EFFECT_STROBE = 10;
  EFFECT_SPARKLE = 11;
  EFFECT_CONFETTI = 12;
  EFFECT_FIRE = 13;
}
